name: MDM agenti

on:
  push:
    branches: [main, mdm-agents]
    paths:
      - 'agents/**'
      - '.github/workflows/mdm-agents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/android
    env:
      AGENT_VERSION_CODE: ${{ github.run_number }}
      AGENT_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ključ za potpisivanje (iz tajni, ako postoji)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tajna ANDROID_KEYSTORE_BASE64 nije postavljena — gradi se debug APK (potpis nije stalan, QR checksum se mijenja)."
          fi
      - name: Unit testovi (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Izgradnja APK-a
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          if [ "${{ steps.keystore.outputs.release }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk out/app-release.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
          fi
          ls -la out
      - name: Kontrolni zbroj potpisa (PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM)
        run: |
          APK=$(ls out/*.apk | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee out/certs.txt
          HEX=$(grep -m1 'certificate SHA-256 digest' out/certs.txt | awk '{print $NF}')
          SIG=$(echo -n "$HEX" | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=\n')
          PKG=$(sha256sum "$APK" | awk '{print $1}' | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=\n')
          echo "$SIG" > out/signature-checksum.txt
          echo "Signature checksum: $SIG"
          {
            echo "## Android agent"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`$(basename "$APK")\` |"
            echo "| SHA-256 certifikata (hex) | \`$HEX\` |"
            echo "| **PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM** | \`$SIG\` |"
            echo "| SHA-256 APK-a (base64url, PACKAGE_CHECKSUM) | \`$PKG\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mdm-agent-android
          path: |
            agents/android/out/*.apk
            agents/android/out/signature-checksum.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: agents/android/app/build/reports/

  windows:
    name: Windows agent
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
        working-directory: agents/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Moduli (PSScriptAnalyzer, Pester 5)
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          $PSVersionTable.PSVersion
      - name: PSScriptAnalyzer
        run: |
          $files = Get-ChildItem -Path . -Include *.ps1, *.psm1 -Recurse
          $issues = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./PSScriptAnalyzerSettings.psd1 }
          $issues | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message | Out-String -Width 250 | Write-Output
          $errors = @($issues | Where-Object Severity -EQ 'Error')
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer: $($errors.Count) grešaka" }
      - name: Pester (Windows PowerShell 5.1)
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/WmsAgent.Tests.ps1'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.TestResult.Enabled = $true
          $cfg.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $cfg
      - name: Dimni test s lažnim poslužiteljem
        run: ./tests/Smoke.ps1 -Port 18080
      - name: Instalacija i deinstalacija (zakazani zadaci, ACL)
        run: |
          $ErrorActionPreference = 'Stop'
          ./install.ps1 -Server 'http://127.0.0.1:18081' -Token 'ci-token' -NoStart
          $t = Get-ScheduledTask -TaskName 'ERPWMS Agent'
          if ($t.Principal.UserId -notmatch 'SYSTEM|S-1-5-18') { throw "Zadatak ne radi kao SYSTEM: $($t.Principal.UserId)" }
          Get-ScheduledTask -TaskName 'ERPWMS Agent (korisnik)' | Out-Null
          $acl = Get-Acl "$env:ProgramData\ERPWMS\agent.json"
          $acl.Access | Format-Table IdentityReference, FileSystemRights, AccessControlType | Out-String | Write-Output
          if ($acl.Access | Where-Object { $_.IdentityReference -match 'Users|Everyone|Authenticated' }) { throw 'agent.json je dostupan običnim korisnicima' }
          $cfg = Get-Content -Raw "$env:ProgramData\ERPWMS\agent.json" | ConvertFrom-Json
          if ($cfg.server -ne 'http://127.0.0.1:18081' -or $cfg.enrollToken -ne 'ci-token') { throw 'agent.json nije ispravan' }
          if (-not (Test-Path "$env:ProgramFiles\ERPWMS\Agent\WmsAgent.psm1")) { throw 'Datoteke agenta nisu kopirane' }
          & "$env:ProgramFiles\ERPWMS\Agent\uninstall.ps1"
          if (Get-ScheduledTask -TaskName 'ERPWMS Agent' -ErrorAction SilentlyContinue) { throw 'Zadatak nije uklonjen' }
          if (Test-Path "$env:ProgramFiles\ERPWMS\Agent") { throw 'Mapa programa nije uklonjena' }
          Write-Output 'Instalacija/deinstalacija u redu.'
      - name: Paket wms-agent.zip
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path WmsAgent.ps1, WmsAgent.psm1, UserAgent.ps1, install.ps1, uninstall.ps1 -DestinationPath out/wms-agent.zip -Force
          Copy-Item install.ps1 out/install.ps1
          $h = (Get-FileHash out/wms-agent.zip -Algorithm SHA256).Hash.ToLower()
          "## Windows agent`n`n| | |`n|---|---|`n| wms-agent.zip SHA-256 | ``$h`` |" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: mdm-agent-windows
          path: |
            agents/windows/out/wms-agent.zip
            agents/windows/out/install.ps1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: agents/windows/pester-results.xml
          if-no-files-found: ignore
