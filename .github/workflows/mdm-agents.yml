name: MDM agenti

on:
  push:
    branches: [main, mdm-agents]
    paths:
      - 'agents/**'
      - '.github/workflows/mdm-agents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/android
    env:
      AGENT_VERSION_CODE: ${{ github.run_number }}
      AGENT_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ključ za potpisivanje (iz tajni, ako postoji)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tajna ANDROID_KEYSTORE_BASE64 nije postavljena — gradi se debug APK (potpis nije stalan, QR checksum se mijenja)."
          fi
      - name: Unit testovi (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Izgradnja APK-a
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p out
          if [ "${{ steps.keystore.outputs.release }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk out/app-release.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
          fi
          ls -la out
      - name: Kontrolni zbroj potpisa (PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM)
        run: |
          APK=$(ls out/*.apk | head -1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee out/certs.txt
          HEX=$(grep -m1 'certificate SHA-256 digest' out/certs.txt | awk '{print $NF}')
          SIG=$(echo -n "$HEX" | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=\n')
          PKG=$(sha256sum "$APK" | awk '{print $1}' | xxd -r -p | base64 | tr '+/' '-_' | tr -d '=\n')
          echo "$SIG" > out/signature-checksum.txt
          echo "Signature checksum: $SIG"
          {
            echo "## Android agent"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| APK | \`$(basename "$APK")\` |"
            echo "| SHA-256 certifikata (hex) | \`$HEX\` |"
            echo "| **PROVISIONING_DEVICE_ADMIN_SIGNATURE_CHECKSUM** | \`$SIG\` |"
            echo "| SHA-256 APK-a (base64url, PACKAGE_CHECKSUM) | \`$PKG\` |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mdm-agent-android
          path: |
            agents/android/out/*.apk
            agents/android/out/signature-checksum.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: agents/android/app/build/reports/
